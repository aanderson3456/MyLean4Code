name = "ComplexAnalysis"
version = "0.1.0"
defaultTargets = ["complexanalysis"]

[[require]]
name = "mathlib"
scope = "leanprover-community"

[[lean_lib]]
name = "ComplexAnalysis"
roots = ["ComplexAnalysis", "Basic", "brennan", "CauchyRiemann", "R2", "Sarason", "ConformalDiskGeometry", "Contour", "Laplace", "Zeta", "PNT", "Newman", "SlitHarmonicMeasure", "BlaschkeBRV", "QuasiRiemannSarason"]

[[lean_exe]]
name = "complexanalysis"
root = "Main"
