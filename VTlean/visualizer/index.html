<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deletion Confusion Matrix Fractal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Controls -->
        <aside class="glass-panel sidebar">
            <h2>Parameters</h2>
            
            <div class="control-group">
                <label for="n-slider">Word Length ($n$): <span id="n-val">4</span></label>
                <input type="range" id="n-slider" min="2" max="6" value="4" step="1">
            </div>
            
            <div class="control-group">
                <label for="k-slider">Deletion Window ($k$): <span id="k-val">4</span></label>
                <input type="range" id="k-slider" min="1" max="4" value="4" step="1">
            </div>

            <div class="control-group">
                <label for="row-order">Row Order ($x \in B^n$):</label>
                <select id="row-order" class="select-control">
                    <option value="lex">Lexicographical (Standard)</option>
                    <option value="weight">Weight Grouped</option>
                    <option value="syndrome">VT Syndrome Grouped</option>
                    <option value="runs">Run Count Grouped</option>
                </select>
            </div>

            <div class="control-group">
                <label for="col-order">Column Order ($y \in B^{n-1}$):</label>
                <select id="col-order" class="select-control">
                    <option value="lex">Lexicographical (Standard)</option>
                    <option value="weight">Weight Grouped</option>
                    <option value="syndrome">VT Syndrome Grouped</option>
                </select>
            </div>

            <div class="control-group action-buttons">
                <button id="play-btn" class="btn primary">▶ Auto Play</button>
            </div>

            <div class="code-panel">
                <h3>Set-Maximal Deletion Codes</h3>
                <div class="code-controls">
                    <button id="prev-code-btn" class="btn small">◀ Prev</button>
                    <button id="next-code-btn" class="btn small">Next ▶</button>
                </div>
                <div id="code-label" class="code-label">None</div>
            </div>

            <div class="info-panel">
                <h3>Selection Details</h3>
                <div id="hover-info" class="hover-info empty">
                    Hover over a highlighted cell to see details.
                </div>
            </div>
        </aside>

        <!-- Main Visualization -->
        <main class="main-content">
            <header class="glass-panel header">
                <div class="header-main">
                    <h1>Modular Invariants of the Deletion Matrix $A_{n,k}$</h1>
                    <p>Exploring confusion subpatterns, run counts, and syndrome transitions</p>
                </div>
                <!-- Navigation Tabs -->
                <div class="tabs-container">
                    <button class="tab-btn active" data-tab="matrix">Matrix & Subpatterns</button>
                    <button class="tab-btn" data-tab="transitions">Syndrome Transitions</button>
                    <button class="tab-btn" data-tab="invariants">Invariant Explorer</button>
                </div>
            </header>

            <!-- Tab 1: Matrix Visualizer -->
            <div id="tab-matrix" class="tab-content active glass-panel visualization-area">
                <div id="matrix-container"></div>
            </div>

            <!-- Tab 2: Syndrome Transitions -->
            <div id="tab-transitions" class="tab-content glass-panel visualization-area">
                <div id="transitions-container"></div>
            </div>

            <!-- Tab 3: Invariant Explorer -->
            <div id="tab-invariants" class="tab-content glass-panel visualization-area scrolls">
                <div id="invariants-container"></div>
            </div>

            <div class="glass-panel formulation-area">
                <div id="katex-formulation"></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
